<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img *ngIf="logoBase64" [src]="logoBase64" alt="Logo" class="login-logo">
      <svg *ngIf="!logoBase64" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
      </svg>
      <h1>{{ siteName }}</h1>
      <p>Panel de Administración</p>
    </div>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="admin@correo.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="error-msg" *ngIf="error">{{ error }}</div>
      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || !email || !password">
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
    <div class="login-footer">
      <a routerLink="/">Volver al inicio</a>
    </div>
  </div>
</div>
